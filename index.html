<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ruichen(Cheryl) Ma</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #050505;
    --ink: #ffffff;
    --muted: #9a9a9a;
    --hover: #777777;
    --line: #232323;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 400; -webkit-font-smoothing: antialiased;
    font-size: 13px; line-height: 1.5;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 42px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 24px; background: var(--bg); z-index: 100;
  }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .topbar-right { display: flex; gap: 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
  .topbar-right a:hover { color: var(--hover); }

  .board {
    position: relative;
    width: 100%;
    height: 88vh;
    margin-top: 42px;
    padding: 0 3vw;
  }

  .card {
    position: absolute;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.7,.3,1);
  }
  .card .pic {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  .card .pic img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
  }
  .card .cap {
    margin-top: 8px; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.04em;
    color: var(--muted); text-transform: uppercase; line-height: 1.5;
  }
  .card:hover { transform: translateY(-8px) scale(1.04); z-index: 20; }

  .zoom-clone {
    position: fixed; z-index: 500; overflow: hidden; border-radius: 3px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
    transition: all .55s cubic-bezier(.16,.84,.32,1);
  }
  .zoom-clone img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .zoom-veil {
    position: fixed; inset: 0; background: #000; opacity: 0;
    transition: opacity .55s ease; z-index: 400; pointer-events: none;
  }
  .zoom-veil.on { opacity: 1; }

  @media (max-width: 900px) {
    .board { height: auto; display: flex; flex-direction: column; gap: 40px; padding: 20px 20px 60px; }
    .card { position: relative !important; top: auto !important; left: auto !important;
      width: 100% !important; height: 40vh !important; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <span class="brand-name">Ruichen(Cheryl) Ma</span>
    <nav class="topbar-right">
      <a href="mailto:cher.m409@gmail.com">EMAIL</a>
      <a href="https://www.instagram.com/cher71m" target="_blank">INSTAGRAM</a>
    </nav>
  </header>

  <main class="board" id="board"></main>

  <div class="zoom-veil" id="zoomVeil"></div>

<script>
var items = [
  { id:"p1", title:"01 · The Highly Sensitive People", cover:"thesis.png", top:"12vh", left:"12%", w:"27%", h:"42vh", z:6 },
  { id:"p6", title:"06 · Wong Kar Wai Posters", cover:"wongkarwai_movieposter.png", top:"3vh", left:"38%", w:"18%", h:"34vh", z:9 },
  { id:"p5", title:"05 · How to Play Mahjong?", cover:"anyonemahjong.png", top:"40vh", left:"44%", w:"28%", h:"28vh", z:4 },
  { id:"p3", title:"03 · Risograph Color Converter", cover:"ChatGPT_Image_Sep_3__2026_at_08_48_53_PM.png", top:"5vh", left:"60%", w:"21%", h:"18vh", z:8 },
  { id:"p4", title:"04 · Persona", cover:"persona.png", top:"12vh", left:"54%", w:"16%", h:"30vh", z:3 },
  { id:"p8", title:"08 · Nature in the Concrete", cover:"nature_concrete.png", top:"24vh", left:"72%", w:"18%", h:"22vh", z:7 },
  { id:"p9", title:"09 · 256 Images Book", cover:"256imagebook.png", top:"48vh", left:"14%", w:"16%", h:"24vh", z:10 },
  { id:"p7", title:"07 · The Edge", cover:"edge.png", top:"44vh", left:"74%", w:"15%", h:"26vh", z:2 },
  { id:"p2", title:"02 · Brand Amare", cover:"brandamare.png", top:"58vh", left:"28%", w:"15%", h:"18vh", z:5 },
  { id:"p10", title:"10 · Sketch3d.ai", cover:"sketch3d-logo.png", top:"66vh", left:"52%", w:"18%", h:"12vh", z:11 }
];

var board = document.getElementById('board');
var veil = document.getElementById('zoomVeil');

items.forEach(function(item){
  var card = document.createElement('div');
  card.className = 'card';
  card.style.zIndex = item.z || 1;
  card.style.top = item.top;
  card.style.left = item.left;
  card.style.width = item.w;
  card.style.height = item.h;

  var pic = document.createElement('div'); pic.className = 'pic';
  var img = document.createElement('img');
  img.src = item.cover; img.alt = item.title; img.loading = 'lazy';
  pic.appendChild(img); card.appendChild(pic);

  var cap = document.createElement('div'); cap.className = 'cap';
  cap.textContent = item.title;
  card.appendChild(cap);

  card.addEventListener('click', function(){ zoomInto(pic, img.src, item.id); });
  board.appendChild(card);
});

function zoomInto(el, src, id){
  var rect = el.getBoundingClientRect();
  var clone = document.createElement('div');
  clone.className = 'zoom-clone';
  clone.style.top = rect.top + 'px';
  clone.style.left = rect.left + 'px';
  clone.style.width = rect.width + 'px';
  clone.style.height = rect.height + 'px';
  clone.style.transition = 'none';
  var img = document.createElement('img');
  img.src = src;
  clone.appendChild(img);
  document.body.appendChild(clone);
  veil.classList.add('on');

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      clone.style.transition = 'top .55s cubic-bezier(.16,.84,.32,1), left .55s cubic-bezier(.16,.84,.32,1), width .55s cubic-bezier(.16,.84,.32,1), height .55s cubic-bezier(.16,.84,.32,1), border-radius .55s ease';
      clone.style.top = '0px';
      clone.style.left = '0px';
      clone.style.width = '100vw';
      clone.style.height = '100vh';
      clone.style.borderRadius = '0px';
    });
  });

  setTimeout(function(){
    window.location.href = (id === 'p1') ? 'project-page.html' : 'project-page.html#' + id;
  }, 560);
}
</script>

</body>
</html>
